[workspace]
resolver = "2"
members = [
    "crates/peak-core",
    "crates/peak-ui",
    "crates/peak-plugin",
    "crates/peak-panel",
    "crates/peak-emulator",
    "xtask",
]
# Patched dependency copies; built as dependencies, not workspace members.
exclude = ["vendor/egui-baseview", "vendor/baseview", "vendor/nih-plug"]

[workspace.package]
version = "1.0.8"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["DanimanX"]
repository = "https://github.com/DanimanX/ReplicantPeak"

[workspace.dependencies]
peak-core = { path = "crates/peak-core" }
peak-ui = { path = "crates/peak-ui" }
peak-emulator = { path = "crates/peak-emulator" }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Audio code is unusable when it is slow, so keep the DSP path optimized even in
# development builds.
[profile.dev.package.peak-core]
opt-level = 2

# nih_plug_egui pins egui-baseview by git rev. vendor/egui-baseview is that
# exact rev (ec70c3fe6b2f070dcacbc22924431edbe24bd1c0); local fixes on top are
# marked "ReplicantPeak patch" in its sources.
[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }

# nih_plug (standalone window, rev 579130e) and egui-baseview (rev 9a0b42c)
# pin two baseview revs from the same repo. Both now resolve to one vendored
# copy of the newer rev (9a0b42c09d712777b2edb4c5e0cb6baf21e988f0); local
# fixes are marked "ReplicantPeak patch" in its sources.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }

# nih_plug at the rev that was already pinned (de421011f41a6d10fc8c7a6084e4f4dee0143683),
# vendored for fixes in the standalone's cpal backend; local fixes are marked
# "ReplicantPeak patch" in its sources. nih_plug_egui (still from git) resolves
# its nih_plug dependency to this copy as well.
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "vendor/nih-plug" }
