[workspace]
resolver = "2"
members = [
    "crates/peak-core",
    "crates/peak-ui",
    "crates/peak-plugin",
    "crates/peak-panel",
    "crates/peak-emulator",
    "xtask",
]
# Patched dependency copies; built as dependencies, not workspace members.
exclude = ["vendor/egui-baseview"]

[workspace.package]
version = "1.0.8"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["DanimanX"]
repository = "https://github.com/DanimanX/ReplicantPeak"

[workspace.dependencies]
peak-core = { path = "crates/peak-core" }
peak-ui = { path = "crates/peak-ui" }
peak-emulator = { path = "crates/peak-emulator" }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Audio code is unusable when it is slow, so keep the DSP path optimized even in
# development builds.
[profile.dev.package.peak-core]
opt-level = 2

# nih_plug_egui pins egui-baseview by git rev. vendor/egui-baseview is that
# exact rev (ec70c3fe6b2f070dcacbc22924431edbe24bd1c0); local fixes on top are
# marked "ReplicantPeak patch" in its sources.
[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }
