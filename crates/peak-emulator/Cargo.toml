[package]
name = "peak-emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_arm"] }
peak-core = { workspace = true }
egui = { workspace = true }
eframe = "0.31"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "emulate"
path = "src/bin/emulate.rs"
