[package]
name = "peak-plugin"
description = "ReplicantPeak: a firmware-linked wavetable synth plugin (CLAP / VST3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
peak-core = { workspace = true }
peak-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam = "0.8"

[dependencies.nih_plug]
git = "https://github.com/robbert-vdh/nih-plug.git"
rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683"
default-features = false
features = ["vst3"]

[dependencies.nih_plug_egui]
git = "https://github.com/robbert-vdh/nih-plug.git"
rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683"

[dev-dependencies]
# The CLAP probe loads the built cdylib the way a host does.
clap-sys = "0.5"
libloading = "0.8"

[features]
# Catch allocations on the audio thread in development builds.
assert_process_allocs = ["nih_plug/assert_process_allocs"]
